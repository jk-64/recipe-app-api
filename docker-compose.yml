# Docker-compose syntax version: 3.9
# This is used to avoid any break
# if there is any new Docker compose version.
# version: "3.10" THIS IS OBSOLETE AND MUST BE REMOVED

# A docker-compose file is set for one or more services
services:
  # The name of the service that run the docker file is: app
  app:

    # build & context specify
    # that we run the app in our current directory ('.': root dir)
    build:
      context: .
      args:
        - DEV=true

    # Maps: "local_machine_port:docker_container_port"
    ports:
      - "8000:8000"

    # Map local_machine_directory:docker_container_directory
    # This permit to reflect automatically any change done locally
    # into the running container in real time
    volumes:
      - ./app:/app
      # Set volume to the directory created in the dockerfile.
      - dev-static-data:/vol/web

    # The command used to run the service
    # We will override this command by using: $docker compose run

    # If we don't specify a command, the bellow command will be used.
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

    # We define the environment variables
    # for Django to connect the Postgres DB
    environment:
      # As using docker compose,
      # we can use the name of the service as the hostname
      # THE VALUES MATCH THE DB SERVICE ENV. VARIABLES
      - DB_HOST=db
      - DB_NAME=devdb
      - DB_USER=devuser
      - DB_PASS=changeme
      - DEBUG=1
    depends_on:
      - db

  # Adding the database service
  db:
    image: postgres:14-alpine
    volumes:
      - dev-db-data:/var/lib/postgresql/data

    # We set the environment variables
    # They are the initial db configuration for this new db service
    #   database name: devdb
    #   database user: devuser
    #   database user's password: changeme
    # REM: THIS IS OK ONLY FOR DEVELOPMENT.
    # NEVER HARDCODE CREDENTIALS ON PRODUCTION DATABASE !!!!
    environment:
      - POSTGRES_DB=devdb
      - POSTGRES_USER=devuser
      - POSTGRES_PASSWORD=changeme


# We name and create volumes
volumes:
  # We create a volume w/o any information after ':'
  # because it will be handled automatically
  # and set to the 'default location' by the file system.
  dev-db-data:
  # Volume for static files
  dev-static-data:

networks:
  default:
    driver: bridge
    driver_opts:
      'com.docker.network.enable_ipv4': 'true'
      'com.docker.network.enable_ipv6': 'false'